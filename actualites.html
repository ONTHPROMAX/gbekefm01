<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actualités — La rédaction GBÊKÊ FM | GBÊKÊ FM</title>
<meta name="description" content="Toute l'actualité de GBÊKÊ FM et de la région du Gbêkê : reportages, communiqués, culture, santé, éducation et société.">
<link rel="icon" href="assets/brand/gbeke-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body data-page="actualites">
<div id="app-header"></div>

<section class="page-hero">
  <div class="wrap">
    <div class="crumbs"><a href="index.html">Accueil</a> <span>/</span> <span>Actualités</span></div>
    <h1>Actualités & articles</h1>
    <p>Reportages, communiqués et analyses de la rédaction GBÊKÊ FM. Une information de proximité, certifiée JTI à la norme CWA 17493.</p>
  </div>
</section>

<main>
  <section class="section">
    <div class="wrap">
      <div class="toolbar">
        <div class="chips" id="catChips"></div>
        <div class="spacer"></div>
        <div class="search-box" style="width:min(300px,100%)">
          <form id="inlineSearch" onsubmit="return false" style="border-width:1.5px;padding:2px 4px 2px 14px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="q" placeholder="Rechercher un article…" style="font-size:.95rem;padding:8px 0">
          </form>
        </div>
      </div>
      <div class="grid grid-3" id="grid"></div>
      <div id="empty" class="empty hide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h6"/></svg>
        <h3>Aucun article trouvé</h3><p>Essayez une autre catégorie ou un autre mot-clé.</p>
      </div>
    </div>
  </section>
</main>

<div id="app-footer"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
document.addEventListener("gbeke:ready", function () {
  var U = window.GBEKE_UI;
  var cats = ["Toutes"].concat(GBEKE.categories.map(function (c) { return c.nom; }));
  var curCat = "Toutes", q = "";
  document.getElementById("catChips").innerHTML = cats.map(function (c, i) {
    return '<button class="chip' + (i === 0 ? " is-active" : "") + '" data-cat="' + c + '">' + c + '</button>';
  }).join("");
  function render() {
    var list = GBEKE.publishedArticles().filter(function (a) {
      var okCat = (curCat === "Toutes" || a.categorie === curCat);
      var s = (a.titre + " " + a.resume + " " + a.auteur).toLowerCase();
      var okQ = !q || s.indexOf(q.toLowerCase()) > -1;
      return okCat && okQ;
    }).sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
    document.getElementById("grid").innerHTML = list.map(U.articleCard).join("");
    document.getElementById("empty").classList.toggle("hide", list.length > 0);
    U.revealInit();
  }
  document.getElementById("catChips").addEventListener("click", function (e) {
    var b = e.target.closest("[data-cat]"); if (!b) return;
    curCat = b.dataset.cat;
    U.$$("#catChips .chip").forEach(function (c) { c.classList.toggle("is-active", c === b); });
    render();
  });
  document.getElementById("q").addEventListener("input", function (e) { q = e.target.value; render(); });
  render();
});
</script>
</body>
</html>
