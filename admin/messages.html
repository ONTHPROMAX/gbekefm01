<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages | Administration GBÊKÊ FM</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/brand/gbeke-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/admin.css">
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
<div class="admin">
  <aside class="sidebar" id="app-sidebar"></aside>
  <div class="main">
    <header class="topbar" id="app-topbar"></header>
    <div class="content">

      <div class="stats" style="grid-template-columns:repeat(4,1fr)">
        <div class="stat"><div class="ic ic--o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4L4 21l1.1-3.3A8.4 8.4 0 1 1 21 11.5Z"/></svg></div><div class="lbl">Total messages</div><div class="val" id="sTotal">0</div></div>
        <div class="stat"><div class="ic ic--b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg></div><div class="lbl">Non lus</div><div class="val" id="sUnread">0</div></div>
        <div class="stat"><div class="ic ic--g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4 10-10"/></svg></div><div class="lbl">Traités</div><div class="val" id="sDone">0</div></div>
        <div class="stat"><div class="ic ic--p"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><div class="lbl">Temps de réponse moyen</div><div class="val">6 h 40</div></div>
      </div>

      <div class="a-toolbar">
        <div class="a-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q" placeholder="Rechercher un expéditeur, un sujet…"></div>
        <select class="a-select" id="fStatut">
          <option value="">Tous les statuts</option>
          <option value="non_lu">Non lus</option>
          <option value="lu">Lus</option>
          <option value="traite">Traités</option>
          <option value="archive">Archivés</option>
        </select>
        <div class="spacer"></div>
        <button class="a-btn a-btn--ghost" id="markAllBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4 10-10"/></svg> Tout marquer comme lu</button>
      </div>

      <div class="panel"><div class="panel__body flush"><div class="tbl-wrap">
        <table class="tbl">
          <thead><tr><th>Expéditeur</th><th>Sujet</th><th>Aperçu</th><th>Reçu le</th><th>Statut</th><th style="text-align:right">Actions</th></tr></thead>
          <tbody id="body"></tbody>
        </table>
      </div></div></div>
      <div id="empty" class="empty" style="display:none;text-align:center;color:var(--a-muted);padding:40px">Aucun message ne correspond à votre recherche.</div>

    </div>
  </div>
</div>

<!-- Modal : lecture / réponse -->
<div class="a-modal" id="modal">
  <div class="a-modal__scrim"></div>
  <div class="a-modal__box">
    <div class="a-modal__head"><h3 id="mTitle">Message</h3><button class="x" data-close-modal><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="a-modal__body">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
        <div class="mini-av" id="mAv">--</div>
        <div><div style="font-family:var(--font-head);font-weight:600" id="mNom">—</div><div class="sm" id="mEmail" style="color:var(--a-muted);font-size:.82rem">—</div></div>
        <div style="margin-left:auto" id="mBadge"></div>
      </div>
      <div class="legend-row"><span class="l">Sujet</span><b id="mSujet">—</b></div>
      <div class="legend-row"><span class="l">Reçu le</span><b id="mDate">—</b></div>
      <div style="margin:16px 0 6px;font-family:var(--font-head);font-weight:600;font-size:.85rem">Message</div>
      <div id="mTexte" style="background:var(--a-panel-2);border:1px solid var(--a-line);border-radius:12px;padding:16px;font-size:.9rem;line-height:1.6;color:var(--a-text)">—</div>
      <div class="a-field" style="margin-top:18px"><label>Réponse (envoyée par e-mail)</label><textarea class="a-textarea" id="mReponse" placeholder="Rédigez votre réponse…"></textarea></div>
      <div class="a-field"><label>Statut du message</label>
        <select id="mStatut"><option value="non_lu">Non lu</option><option value="lu">Lu</option><option value="traite">Traité</option><option value="archive">Archivé</option></select>
      </div>
    </div>
    <div class="a-modal__foot">
      <button class="a-btn a-btn--danger" id="delBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg> Supprimer</button>
      <div class="spacer" style="flex:1"></div>
      <button class="a-btn a-btn--ghost" data-close-modal>Fermer</button>
      <button class="a-btn a-btn--primary" id="sendBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4 20-7Z"/></svg> Envoyer la réponse</button>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/admin.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var A = window.ADMIN;
  A.mountAdmin("messages", "Messages", "Audience / Messages");

  var body = document.getElementById("body");
  var empty = document.getElementById("empty");
  var current = null;

  function initials(nom) {
    return nom.split(/\s+/).map(function (w) { return w[0]; }).slice(0, 2).join("").toUpperCase();
  }

  function render() {
    var q = document.getElementById("q").value.trim().toLowerCase();
    var st = document.getElementById("fStatut").value;
    var list = A.Store.messages.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
    if (st) list = list.filter(function (m) { return m.statut === st; });
    if (q) list = list.filter(function (m) { return (m.nom + " " + m.email + " " + m.sujet + " " + m.message).toLowerCase().indexOf(q) > -1; });

    body.innerHTML = list.map(function (m) {
      return '<tr>' +
        '<td><div class="cf"><div class="mini-av">' + A.esc(initials(m.nom)) + '</div><div><div class="nm">' + A.esc(m.nom) + '</div><div class="sm">' + A.esc(m.email) + '</div></div></div></td>' +
        '<td><span class="nm">' + A.esc(m.sujet) + '</span></td>' +
        '<td><span class="sm">' + A.esc(m.message.length > 52 ? m.message.slice(0, 52) + "…" : m.message) + '</span></td>' +
        '<td><span class="sm">' + A.esc(m.date) + '</span></td>' +
        '<td>' + A.msgBadge(m.statut) + '</td>' +
        '<td><div class="row-actions">' +
          '<button class="act" data-open="' + m.id + '" title="Lire / répondre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>' +
          '<button class="act" data-archive="' + m.id + '" title="Archiver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/></svg></button>' +
          '<button class="act danger" data-del="' + m.id + '" title="Supprimer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>' +
        '</div></td></tr>';
    }).join("");
    empty.style.display = list.length ? "none" : "block";
    updateStats();
  }

  function updateStats() {
    var m = A.Store.messages;
    document.getElementById("sTotal").textContent = A.fmtNum(m.length);
    document.getElementById("sUnread").textContent = A.fmtNum(m.filter(function (x) { return x.statut === "non_lu"; }).length);
    document.getElementById("sDone").textContent = A.fmtNum(m.filter(function (x) { return x.statut === "traite"; }).length);
  }

  function openMsg(id) {
    var m = A.Store.messages.find(function (x) { return x.id === id; });
    if (!m) return;
    current = m;
    document.getElementById("mAv").textContent = initials(m.nom);
    document.getElementById("mNom").textContent = m.nom;
    document.getElementById("mEmail").textContent = m.email;
    document.getElementById("mSujet").textContent = m.sujet;
    document.getElementById("mDate").textContent = m.date;
    document.getElementById("mTexte").textContent = m.message;
    document.getElementById("mBadge").innerHTML = A.msgBadge(m.statut);
    document.getElementById("mStatut").value = m.statut;
    document.getElementById("mReponse").value = "";
    if (m.statut === "non_lu") { m.statut = "lu"; }
    A.openModal("modal");
    render();
  }

  body.addEventListener("click", function (e) {
    var o = e.target.closest("[data-open]"); if (o) { openMsg(+o.getAttribute("data-open")); return; }
    var a = e.target.closest("[data-archive]");
    if (a) { var m = A.Store.messages.find(function (x) { return x.id === +a.getAttribute("data-archive"); }); if (m) { m.statut = "archive"; render(); A.toast("Message archivé."); } return; }
    var d = e.target.closest("[data-del]");
    if (d) { var id = +d.getAttribute("data-del"); A.Store.messages = A.Store.messages.filter(function (x) { return x.id !== id; }); render(); A.toast("Message supprimé."); }
  });

  document.getElementById("q").addEventListener("input", render);
  document.getElementById("fStatut").addEventListener("change", render);

  document.getElementById("markAllBtn").addEventListener("click", function () {
    A.Store.messages.forEach(function (m) { if (m.statut === "non_lu") m.statut = "lu"; });
    render(); A.toast("Tous les messages sont marqués comme lus.");
  });

  document.getElementById("mStatut").addEventListener("change", function () {
    if (!current) return;
    current.statut = this.value;
    document.getElementById("mBadge").innerHTML = A.msgBadge(current.statut);
    render();
  });

  document.getElementById("sendBtn").addEventListener("click", function () {
    if (!current) return;
    var rep = document.getElementById("mReponse").value.trim();
    if (!rep) { A.toast("Veuillez saisir une réponse avant l'envoi.", false); return; }
    current.statut = "traite";
    A.closeModal("modal");
    render();
    A.toast("Réponse envoyée à " + current.email + ".");
  });

  document.getElementById("delBtn").addEventListener("click", function () {
    if (!current) return;
    A.Store.messages = A.Store.messages.filter(function (x) { return x.id !== current.id; });
    A.closeModal("modal");
    render();
    A.toast("Message supprimé.");
  });

  render();
});
</script>
</body>
</html>
