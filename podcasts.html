<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podcasts — Écoutez et téléchargez | GBÊKÊ FM</title>
<meta name="description" content="Écoutez et téléchargez tous les podcasts de GBÊKÊ FM : émissions culturelles, musicales, santé, éducation et sport.">
<link rel="icon" href="assets/brand/gbeke-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body data-page="podcasts">
<div id="app-header"></div>

<section class="page-hero">
  <div class="wrap">
    <div class="crumbs"><a href="index.html">Accueil</a> <span>/</span> <span>Podcasts</span></div>
    <h1>Podcasts</h1>
    <p>Écoutez en streaming ou téléchargez librement, sans obligation de compte. Vos favoris et votre historique vous attendent une fois connecté.</p>
  </div>
</section>

<main>
  <section class="section">
    <div class="wrap">
      <div class="toolbar">
        <div class="chips" id="catChips"></div>
        <div class="spacer"></div>
        <select class="select" id="emSel"></select>
        <select class="select" id="sortSel">
          <option value="recent">Plus récents</option>
          <option value="pop">Plus écoutés</option>
          <option value="dl">Plus téléchargés</option>
          <option value="titre">Titre A → Z</option>
        </select>
      </div>
      <div class="grid grid-3" id="grid"></div>
      <div id="empty" class="empty hide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <h3>Aucun podcast trouvé</h3><p>Modifiez vos filtres.</p>
      </div>
    </div>
  </section>
</main>

<div id="app-footer"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
document.addEventListener("gbeke:ready", function () {
  var U = window.GBEKE_UI;
  var cats = ["Toutes"].concat(GBEKE.categories.map(function (c) { return c.nom; }));
  var curCat = "Toutes", curEm = "all", curSort = "recent";
  document.getElementById("catChips").innerHTML = cats.map(function (c, i) {
    return '<button class="chip' + (i === 0 ? " is-active" : "") + '" data-cat="' + c + '">' + c + '</button>';
  }).join("");
  document.getElementById("emSel").innerHTML = '<option value="all">Toutes les émissions</option>' +
    GBEKE.emissions.map(function (e) { return '<option value="' + e.id + '">' + e.nom + '</option>'; }).join("");
  function render() {
    var list = GBEKE.publishedPodcasts().filter(function (p) {
      return (curCat === "Toutes" || p.categorie === curCat) && (curEm === "all" || p.emissionId === Number(curEm));
    });
    if (curSort === "recent") list.sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
    if (curSort === "pop") list.sort(function (a, b) { return b.ecoute - a.ecoute; });
    if (curSort === "dl") list.sort(function (a, b) { return b.telechargements - a.telechargements; });
    if (curSort === "titre") list.sort(function (a, b) { return a.titre.localeCompare(b.titre); });
    document.getElementById("grid").innerHTML = list.map(U.podcastGridCard).join("");
    document.getElementById("empty").classList.toggle("hide", list.length > 0);
    U.revealInit();
  }
  document.getElementById("catChips").addEventListener("click", function (e) {
    var b = e.target.closest("[data-cat]"); if (!b) return;
    curCat = b.dataset.cat;
    U.$$("#catChips .chip").forEach(function (c) { c.classList.toggle("is-active", c === b); });
    render();
  });
  document.getElementById("emSel").addEventListener("change", function (e) { curEm = e.target.value; render(); });
  document.getElementById("sortSel").addEventListener("change", function (e) { curSort = e.target.value; render(); });
  render();
});
</script>
</body>
</html>
